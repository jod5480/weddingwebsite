<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="30%" stop-color="#E2B755"/>
      <stop offset="60%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#916E16"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#550E18"/>
      <stop offset="50%" stop-color="#3F0910"/>
      <stop offset="100%" stop-color="#240408"/>
    </linearGradient>
  </defs>

  <!-- Deep Wine Circle with Gold Border -->
  <circle cx="32" cy="32" r="30" fill="url(#wineGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.6"/>

  <!-- Interlocking Wedding Rings Monogram -->
  <!-- Left Ring -->
  <circle cx="26" cy="32" r="12" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <!-- Right Ring Interlocking -->
  <circle cx="38" cy="32" r="12" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Overlap weave effect -->
  <path d="M 32 21.6 A 12 12 0 0 1 34 23.5" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 32 42.4 A 12 12 0 0 0 34 40.5" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Sparkling Diamond on top of right ring -->
  <polygon points="38,16 41,20 38,24 35,20" fill="#FFF8E7"/>
  <circle cx="38" cy="20" r="1.5" fill="#FFFFFF"/>
</svg>
